<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="player-container">
        <h1 id="titulo"></h1>
        <p id="desc" style="color: #aaa; margin-bottom: 20px;"></p>
        
        <video id="meu-video" controls autoplay>
            Seu navegador não suporta a tag de vídeo.
        </video>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("titulo").textContent = params.get("titulo");
        document.getElementById("desc").textContent = params.get("desc");
        document.getElementById("meu-video").src = params.get("video");
    </script>
</body>
</html>
