<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body oncontextmenu="return false;" onkeydown="return bloquearAtalhos(event)">

    <header>
        <div class="header-left">
            <h1>PYFLIX</h1>
        </div>
        <div class="header-right">
            <a href="/" class="logout-btn" style="text-decoration: none;">Voltar ao Início</a>
        </div>
    </header>

    <div class="player-container">
        <h1 id="titulo"></h1>
        <p id="desc"></p>
        
        <div class="audio-selector">
            <span>🛡️ <strong>Conteúdo Protegido:</strong> O download deste vídeo está desativado por razões de direitos autorais da plataforma.</span>
        </div>

        <!-- Video tag com controles mas sem controle de download nativo cru -->
        <video id="meu-video" controls controlsList="nodownload noplaybackrate" disablePictureInPicture autoplay>
            Seu navegador não suporta a tag de vídeo.
        </video>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const videoUrl = params.get("video");

        document.getElementById("titulo").textContent = titulo;
        document.getElementById("desc").textContent = desc;

        const videoElement = document.getElementById("meu-video");
        videoElement.src = videoUrl;

        // Bloqueio de inspeção e atalhos de salvamento
        function bloquearAtalhos(e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "s")) {
                alert("Ação protegida e restrita pelo sistema PyFlix.");
                return false;
            }
        }
    </script>
</body>
</html>
