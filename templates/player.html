<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body oncontextmenu="return false;" onkeydown="return bloquearAtalhos(event)">

    <header>
        <div class="header-left">
            <a href="/" style="text-decoration: none;"><h1>PYFLIX</h1></a>
        </div>
        <div class="header-right">
            <!-- Botão Voltar ao Catálogo também no Cabeçalho (Topo) -->
            <a href="/" class="logout-btn" style="text-decoration: none; background-color: #333;">⬅ Voltar ao Catálogo</a>
            <a href="/logout" class="logout-btn">Sair</a>
        </div>
    </header>

    <div class="player-container">
        <!-- Título e Descrição Detalhada -->
        <h1 id="titulo" style="font-size: 32px; margin-bottom: 12px; color: #fff; font-weight: bold;"></h1>
        <p id="desc" style="font-size: 16px; color: #cccccc; line-height: 1.6; margin-bottom: 20px;"></p>
        
        <!-- Painel de Controlo do Player -->
        <div class="audio-selector" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: #222; padding: 15px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #e50914;">
            <span style="color: #fff; font-size: 14px;">🛡️ <strong>Player Seguro:</strong> Download desativado.</span>
            
            <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                <label style="color: #bbb; font-size: 14px;">Idioma / Legenda: 
                    <select id="selectIdioma" onchange="mudarIdioma()" style="background: #111; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
                        <option value="pt" selected>Português (BR)</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="off">Desativado</option>
                    </select>
                </label>

                <label style="color: #bbb; font-size: 14px;">Velocidade: 
                    <select id="selectVelocidade" onchange="mudarVelocidade()" style="background: #111; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; cursor: pointer;">
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                </label>

                <button onclick="alternarPip()" style="background: #e50914; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">🖥️ Modo Pop-up (PiP)</button>
            </div>
        </div>

        <!-- Tag de Vídeo -->
        <div class="video-box-wrapper">
            <video id="meu-video" controls controlsList="nodownload" autoplay>
                <source id="videoSource" src="" type="video/mp4">
                <track id="videoTrack" kind="subtitles" srclang="pt" label="Português">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>
        
        <!-- Botão Voltar ao Catálogo na parte inferior -->
        <div style="margin-top: 25px;">
            <a href="/" class="back-btn">⬅ Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const videoUrl = params.get("video");
        const legendaUrl = params.get("legenda");

        document.getElementById("titulo").textContent = titulo || "Título Indisponível";
        document.getElementById("desc").textContent = desc || "Sem descrição detalhada disponível para este título.";

        const videoElement = document.getElementById("meu-video");
        const videoSource = document.getElementById("videoSource");
        const videoTrack = document.getElementById("videoTrack");

        if (videoUrl) {
            videoSource.src = videoUrl;
        }

        if (legendaUrl && legendaUrl.trim() !== "") {
            videoTrack.src = legendaUrl;
            videoTrack.srclang = "pt";
            videoTrack.label = "Português";
            videoTrack.default = true;
        } else {
            videoTrack.remove();
        }

        videoElement.load();

        function mudarIdioma() {
            const idioma = document.getElementById("selectIdioma").value;
            const tracks = videoElement.textTracks;
            
            for (let i = 0; i < tracks.length; i++) {
                if (idioma === "off") {
                    tracks[i].mode = "hidden";
                } else {
                    tracks[i].mode = "showing";
                }
            }
        }

        function mudarVelocidade() {
            const vel = document.getElementById("selectVelocidade").value;
            videoElement.playbackRate = parseFloat(vel);
        }

        async function alternarPip() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled) {
                    await videoElement.requestPictureInPicture();
                } else {
                    alert("O seu navegador não suporta o modo Pop-up (PiP).");
                }
            } catch (error) {
                console.error("Erro ao alternar o modo Pop-up:", error);
            }
        }

        function bloquearAtalhos(e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "s")) {
                alert("Ação protegida e restrita pelo sistema PyFlix.");
                return false;
            }
        }
    </script>
</body>
</html>
