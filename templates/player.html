<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body oncontextmenu="return false;" onkeydown="return bloquearAtalhos(event)">

    <header>
        <div class="header-left">
            <h1>PYFLIX</h1>
        </div>
        <div class="header-right">
            <a href="/" class="logout-btn" style="text-decoration: none;">Voltar ao Início</a>
        </div>
    </header>

    <div class="player-container">
        <h1 id="titulo" style="font-size: 32px; margin-bottom: 10px; color: #fff;"></h1>
        <p id="desc" style="font-size: 16px; color: #b3b3b3; line-height: 1.6; margin-bottom: 20px;"></p>
        
        <div class="audio-selector">
            <span>🛡️ <strong>Proteção de Direitos:</strong> O download deste vídeo está bloqueado. Desfrute da reprodução em alta definição e ecrã inteiro.</span>
        </div>

        <div class="video-box-wrapper">
            <video id="meu-video" controls controlsList="nodownload noplaybackrate" disablePictureInPicture autoplay>
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const videoUrl = params.get("video");

        document.getElementById("titulo").textContent = titulo || "Título Indisponível";
        document.getElementById("desc").textContent = desc || "Sem descrição detalhada para este título.";

        const videoElement = document.getElementById("meu-video");
        if (videoUrl) {
            videoElement.src = videoUrl;
        }

        function bloquearAtalhos(e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "s")) {
                alert("Ação protegida e restrita pelo sistema PyFlix.");
                return false;
            }
        }
    </script>
</body>
</html>
