<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body oncontextmenu="return false;" onkeydown="return bloquearAtalhos(event)">

    <header>
        <div class="header-left">
            <a href="/" style="text-decoration: none;"><h1>PYFLIX</h1></a>
        </div>
        <div class="header-right">
            <a href="/" class="logout-btn" style="text-decoration: none;">Voltar ao Início</a>
        </div>
    </header>

    <div class="player-container">
        <h1 id="titulo" style="font-size: 30px; margin-bottom: 10px; color: #fff;"></h1>
        <p id="desc" style="font-size: 15px; color: #b3b3b3; line-height: 1.5; margin-bottom: 20px;"></p>
        
        <div class="audio-selector" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <span>🛡️ <strong>Player Seguro:</strong> Download desativado.</span>
            
            <div style="display: flex; gap: 15px; align-items: center;">
                <label>Velocidade: 
                    <select id="selectVelocidade" onchange="mudarVelocidade()" style="background: #111; color: #fff; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; cursor: pointer;">
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x (Normal)</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>
                </label>

                <button onclick="alternarPip()" style="background: #e50914; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">🖥️ Modo Pop-up (PiP)</button>
            </div>
        </div>

        <div class="video-box-wrapper">
            <video id="meu-video" controls controlsList="nodownload" autoplay>
                <source id="videoSource" src="" type="video/mp4">
                <track id="videoTrack" kind="subtitles" srclang="pt" label="Português">
                Seu navegador não suporta a tag de vídeo.
            </video>
        </div>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const videoUrl = params.get("video");
        const legendaUrl = params.get("legenda");

        document.getElementById("titulo").textContent = titulo || "Título Indisponível";
        document.getElementById("desc").textContent = desc || "Sem descrição detalhada disponível para este título.";

        const videoElement = document.getElementById("meu-video");
        const videoSource = document.getElementById("videoSource");
        const videoTrack = document.getElementById("videoTrack");

        if (videoUrl) {
            videoSource.src = videoUrl;
        }

        if (legendaUrl && legendaUrl.trim() !== "") {
            videoTrack.src = legendaUrl;
            videoTrack.default = true;
        } else {
            videoTrack.remove();
        }

        videoElement.load();

        function mudarVelocidade() {
            const vel = document.getElementById("selectVelocidade").value;
            videoElement.playbackRate = parseFloat(vel);
        }

        async function alternarPip() {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled) {
                    await videoElement.requestPictureInPicture();
                } else {
                    alert("O seu navegador não suporta o modo Pop-up (PiP).");
                }
            } catch (error) {
                console.error("Erro ao alternar o modo Pop-up:", error);
            }
        }

        function bloquearAtalhos(e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "s")) {
                alert("Ação protegida e restrita pelo sistema PyFlix.");
                return false;
            }
        }
    </script>
</body>
</html>
