<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="player-container">
        <h1 id="titulo"></h1>
        <p id="desc" style="color: #aaa; margin-bottom: 15px;"></p>
        
        <!-- Seletor de Idioma de Áudio -->
        <div class="audio-selector">
            <label for="idioma-audio">Idioma do Áudio: </label>
            <select id="idioma-audio" onchange="mudarIdiomaAudio()">
                <option value="pt">Português (Dublado)</option>
                <option value="en">English (Original)</option>
            </select>
        </div>

        <video id="meu-video" controls autoplay>
            Seu navegador não suporta a tag de vídeo.
        </video>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const videoPt = params.get("video_pt");
        const videoEn = params.get("video_en");

        document.getElementById("titulo").textContent = titulo;
        document.getElementById("desc").textContent = desc;

        const videoElement = document.getElementById("meu-video");
        videoElement.src = videoPt;

        function mudarIdiomaAudio() {
            const idioma = document.getElementById("idioma-audio").value;
            const tempoAtual = videoElement.currentTime;
            
            if (idioma === "en") {
                videoElement.src = videoEn;
            } else {
                videoElement.src = videoPt;
            }
            
            videoElement.currentTime = tempoAtual;
            videoElement.play();
        }
    </script>
</body>
</html>
