<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="header-left">
            <h1>PYFLIX</h1>
        </div>
        <div class="header-right">
            <a href="/" class="logout-btn" style="text-decoration: none;">Voltar ao Início</a>
        </div>
    </header>

    <div class="player-container">
        <h1 id="titulo"></h1>
        <p id="desc" style="color: #aaa; margin-bottom: 15px;"></p>
        
        <!-- Aviso sobre Legendas/Tradução do YouTube -->
        <div class="audio-selector">
            <span>💡 <strong>Dica de Áudio/Legenda:</strong> Utilize as configurações do player do YouTube abaixo para ativar legendas ou tradução automática para Português/Inglês.</span>
        </div>

        <!-- Player do YouTube Integrado (Bloqueia Download nativamente) -->
        <div class="video-wrapper">
            <iframe id="youtube-player" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        
        <div>
            <a href="/" class="back-btn">Voltar ao Catálogo</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get("titulo");
        const desc = params.get("desc");
        const youtubeId = params.get("youtube_id");

        document.getElementById("titulo").textContent = titulo;
        document.getElementById("desc").textContent = desc;

        // Configura a URL do iframe do YouTube com autoplay e controles limpos
        const iframe = document.getElementById("youtube-player");
        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&modestbranding=1&rel=0`;
    </script>
</body>
</html>
