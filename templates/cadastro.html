<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>PyFlix</h1>
        <h2>Criar Conta</h2>
        
        {% if erro %}
            <p style="color: #e50914; margin-bottom: 15px; font-size: 14px;">{{ erro }}</p>
        {% endif %}

        <form method="POST" onsubmit="return validarSenhas()">
            <input type="text" name="nome" placeholder="Nome completo" required class="auth-input">
            <input type="email" name="email" placeholder="E-mail" required class="auth-input">
            <input type="password" id="senha" name="senha" placeholder="Criar senha" required class="auth-input">
            <input type="password" id="confirma_senha" name="confirma_senha" placeholder="Confirme a senha" required class="auth-input">
            <button type="submit" class="auth-btn">Cadastrar</button>
        </form>
        
        <p class="auth-link">Já tem conta? <a href="/login">Faça login</a>.</p>
    </div>

    <script>
        function validarSenhas() {
            const senha = document.getElementById('senha').value;
            const confirma = document.getElementById('confirma_senha').value;
            if (senha !== confirma) {
                alert('As senhas não coincidem! Por favor, verifique.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
