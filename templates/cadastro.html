<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>PyFlix</h1>
        <h2>Criar Conta</h2>
        {% if erro %}<p style="color: #e50914; margin-bottom: 15px; font-size: 14px;">{{ erro }}</p>{% endif %}
        <form method="POST">
            <input type="text" name="nome" placeholder="Nome completo" required class="auth-input">
            <input type="email" name="email" placeholder="E-mail" required class="auth-input">
            <input type="password" name="senha" placeholder="Criar senha" required class="auth-input">
            <button type="submit" class="auth-btn">Cadastrar</button>
        </form>
        <p class="auth-link">Já tem conta? <a href="/login">Faça login</a>.</p>
    </div>
</body>
</html>
