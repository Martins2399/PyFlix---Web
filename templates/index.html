<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyFlix Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>PyFlix</h1>
        <div class="user-perfil-box">
            <span>Olá, <strong>{{ usuario }}</strong></span>
            <button onclick="abrirModalSair()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="container" id="catalog-container"></div>

    <!-- Modal de Confirmação de Saída -->
    <div id="modal-sair" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Deseja realmente sair?</h3>
            <p>Sua sessão será encerrada e você precisará entrar novamente.</p>
            <div class="modal-buttons">
                <button onclick="fecharModalSair()" class="btn-cancelar">Cancelar</button>
                <a href="/logout" class="btn-confirmar">Sim, Sair</a>
            </div>
        </div>
    </div>

    <script>
        function abrirModalSair() {
            document.getElementById('modal-sair').style.display = 'flex';
        }
        function fecharModalSair() {
            document.getElementById('modal-sair').style.display = 'none';
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetch('/static/data/catalog.json')
                .then(response => response.json())
                .then(filmes => {
                    const container = document.getElementById("catalog-container");
                    let categorias = {};
                    
                    filmes.forEach(filme => {
                        if (!categorias[filme.categoria]) categorias[filme.categoria] = [];
                        categorias[filme.categoria].push(filme);
                    });

                    for (const [cat, itens] of Object.entries(categorias)) {
                        let secao = document.createElement("div");
                        secao.classList.add("categoria-secao");
                        secao.innerHTML = `<h2>${cat}</h2>`;
                        
                        let row = document.createElement("div");
                        row.classList.add("cards-row");

                        itens.forEach(filme => {
                            let card = document.createElement("div");
                            card.classList.add("media-card");
                            card.innerHTML = `
                                <img src="${filme.imagem}" alt="${filme.titulo}" onerror="this.src='https://via.placeholder.com/200x280?text=Sem+Imagem'">
                                <div class="media-card-info"><h3>${filme.titulo}</h3></div>
                            `;
                            card.addEventListener("click", () => {
                                const params = new URLSearchParams({
                                    titulo: filme.titulo,
                                    desc: filme.descricao,
                                    video_pt: filme.video_pt,
                                    video_en: filme.video_en
                                });
                                window.location.href = `/player?${params.toString()}`;
                            });
                            row.appendChild(card);
                        });

                        secao.appendChild(row);
                        container.appendChild(secao);
                    }
                });
        });
    </script>
</body>
</html>
