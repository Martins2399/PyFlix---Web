<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Entrar - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>PYFLIX</h1>
        <h2>Entrar</h2>
        {% if erro %}
            <p style="color: #e50914; margin-bottom: 15px; font-size: 14px;">{{ erro }}</p>
        {% endif %}
        <form method="POST">
            <input type="email" name="email" placeholder="E-mail" required class="auth-input">
            
            <div class="password-group">
                <input type="password" id="senha" name="senha" placeholder="Senha" required class="auth-input">
                <span class="toggle-password" onclick="toggleSenha('senha', this)">👁️</span>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; font-size: 13px; color: #b3b3b3;">
                <label><input type="checkbox" style="accent-color: #e50914;"> Lembrar-me</label>
                <a href="/recuperar" style="color: #b3b3b3; text-decoration: none;">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="auth-btn">Entrar</button>
        </form>

        <!-- Botão de Acesso como Visitante -->
        <div style="margin-top: 15px; text-align: center;">
            <a href="/visitante" style="display: block; width: 100%; padding: 12px; background-color: #333; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; transition: background 0.2s;">Entrar como Visitante 👤</a>
        </div>
        
        <p class="auth-link">Novo por aqui? <a href="/cadastro">Cadastre-se agora</a>.</p>
    </div>

    <script>
        function toggleSenha(idInput, el) {
            const input = document.getElementById(idInput);
            if (input.type === "password") {
                input.type = "text";
                el.textContent = "🙈";
            } else {
                input.type = "password";
                el.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
