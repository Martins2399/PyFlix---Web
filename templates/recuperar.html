<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - PyFlix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>PYFLIX</h1>
        <h2>Recuperar Senha</h2>
        
        {% if erro %}
            <p style="color: #e50914; margin-bottom: 15px; font-size: 14px;">{{ erro }}</p>
        {% endif %}

        <form method="POST">
            <input type="email" name="email" placeholder="Digite seu e-mail cadastrado" required class="auth-input">
            
            <div class="password-group">
                <input type="password" id="nova_senha" name="nova_senha" placeholder="Digite a nova senha" required class="auth-input">
                <span class="toggle-password" onclick="toggleSenha('nova_senha', this)">👁️</span>
            </div>

            <button type="submit" class="auth-btn">Atualizar Senha</button>
        </form>

        <div style="margin-top: 15px; text-align: center;">
            <a href="/login" style="display: block; width: 100%; padding: 12px; background-color: #333; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 14px; transition: background 0.2s;">Voltar ao Início / Login</a>
        </div>
        
        <p class="auth-link">Lembrou da senha? <a href="/login">Faça login</a>.</p>
    </div>

    <script>
        function toggleSenha(idInput, el) {
            const input = document.getElementById(idInput);
            if (input.type === "password") {
                input.type = "text";
                el.textContent = "🙈";
            } else {
                input.type = "password";
                el.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
